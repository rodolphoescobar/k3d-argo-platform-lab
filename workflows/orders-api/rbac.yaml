
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-workflow
  namespace: orders
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orders-workflow-executor
  namespace: orders
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orders-workflow-executor
  namespace: orders
subjects:
  - kind: ServiceAccount
    name: orders-workflow
    namespace: orders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orders-workflow-executor
