
apiVersion: v1
kind: Namespace
metadata:
  name: orders
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-code
  namespace: orders
data:
  app.py: |
    import json
    import os
    import time
    from collections import defaultdict
    from http.server import BaseHTTPRequestHandler, HTTPServer

    VERSION = os.getenv("APP_VERSION", "v1")
    REQUESTS = defaultdict(int)
    DURATION_SUM = defaultdict(float)
    DURATION_COUNT = defaultdict(int)

    class Handler(BaseHTTPRequestHandler):

        def do_GET(self):
            start = time.monotonic()
            path = self.path.split("?")[0]

            if path == "/metrics":
                lines = [
                    "# HELP orders_http_requests_total Total HTTP requests",
                    "# TYPE orders_http_requests_total counter",
                ]

                for (route, status), count in REQUESTS.items():
                    lines.append(
                        'orders_http_requests_total'
                        f'{{version="{VERSION}",path="{route}",'
                        f'status="{status}"}} {count}'
                    )

                lines += [
                    "# HELP orders_http_request_duration_seconds "
                    "HTTP request duration",
                    "# TYPE orders_http_request_duration_seconds summary",
                ]

                for route, count in DURATION_COUNT.items():
                    lines.append(
                        'orders_http_request_duration_seconds_count'
                        f'{{version="{VERSION}",path="{route}"}} {count}'
                    )
                    lines.append(
                        'orders_http_request_duration_seconds_sum'
                        f'{{version="{VERSION}",path="{route}"}} '
                        f'{DURATION_SUM[route]}'
                    )

                self.respond(200, "\n".join(lines) + "\n",
                             "text/plain; version=0.0.4")
                return

            if path in ("/health", "/ready"):
                status = 200
                data = {"status": "ok", "version": VERSION}

            elif path == "/api/orders":
                if VERSION == "v-bad":
                    status = 500
                    data = {
                        "service": "orders-api",
                        "version": VERSION,
                        "error": "simulated database failure"
                    }
                else:
                    status = 200
                    data = {
                        "service": "orders-api",
                        "version": VERSION,
                        "orders": [
                            {"id": 1, "status": "created"},
                            {"id": 2, "status": "processing"}
                        ]
                    }

            else:
                status = 404
                data = {"error": "not found"}

            body = json.dumps(data)
            self.respond(status, body, "application/json")

            elapsed = time.monotonic() - start
            REQUESTS[(path, str(status))] += 1
            DURATION_SUM[path] += elapsed
            DURATION_COUNT[path] += 1

        def respond(self, status, body, content_type):
            encoded = body.encode()
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(encoded)))
            self.end_headers()
            self.wfile.write(encoded)

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
  namespace: orders
spec:
  parentRefs:
    - name: public-gateway
      namespace: default
      sectionName: http
  hostnames:
    - orders.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: orders-api-stable
          kind: Service
          port: 80
          weight: 100
        - name: orders-api-canary
          kind: Service
          port: 80
          weight: 0

