
apiVersion: v1
kind: Namespace
metadata:
  name: orders
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-code
  namespace: orders
data:
  app.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    VERSION = os.getenv("APP_VERSION", "v1")

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ("/health", "/ready"):
                status = 200
                result = {"status": "ok", "version": VERSION}
            elif self.path == "/api/orders":
                status = 200
                result = {
                    "service": "orders-api",
                    "version": VERSION,
                    "orders": [
                        {"id": 1, "status": "created"},
                        {"id": 2, "status": "processing"}
                    ]
                }
            else:
                status = 404
                result = {"error": "not found"}

            body = json.dumps(result).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: python:3.12-alpine
          command:
            - python
            - -u
            - /app/app.py
          env:
            - name: APP_VERSION
              value: "v1"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: orders-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: orders
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
  namespace: orders
spec:
  parentRefs:
    - name: public-gateway
      namespace: default
      sectionName: http
  hostnames:
    - orders.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: orders-api
          port: 80
