
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: orders-api
    monitoring: enabled
  name: orders-api-stable
  namespace: orders
spec:
  selector:
    app: orders-api-rollout
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: orders-api
    monitoring: enabled
  name: orders-api-canary
  namespace: orders
spec:
  selector:
    app: orders-api-rollout
  ports:
    - name: http
      port: 80
      targetPort: 8080
