
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders-api-rollout
  namespace: orders
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: orders-api-rollout

  template:
    metadata:
      labels:
        app: orders-api-rollout
    spec:
      containers:
        - name: orders-api
          image: python:3.12-alpine
          command:
            - python
            - -u
            - /app/app.py
          env:
            - name: APP_VERSION
              value: "v1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: orders-api-code

  strategy:
    canary:
      stableService: orders-api-stable
      canaryService: orders-api-canary

      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoutes:
              - name: orders-api
            namespace: orders

      steps:
        - setWeight: 10
        - pause: {}

        - setWeight: 25
        - pause:
            duration: 60s

        - setWeight: 50
        - pause: {}

        - setWeight: 100
