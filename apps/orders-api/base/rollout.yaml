
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders-api-rollout
  namespace: orders
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: orders-api-rollout

  template:
    metadata:
      annotations:
        lab.openai.com/config-revision: "metrics-v1"
      labels:
        app: orders-api-rollout
    spec:
      containers:
        - name: orders-api
          image: python:3.12-alpine
          command:
            - python
            - -u
            - /app/app.py
          env:
            - name: APP_VERSION
              value: "v4"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: orders-api-code

  strategy:
    canary:
      stableService: orders-api-stable
      canaryService: orders-api-canary

      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoutes:
              - name: orders-api
            namespace: orders

      steps:
      # Envia 10% do tráfego para a nova revisão
      - setWeight: 10

      # Executa testes e bloqueia em caso de falha
      - analysis:
          templates:
            - templateName: orders-api-smoke-test

      # Avança para 25% após aprovação
      - setWeight: 25
      - pause:
          duration: 30s

      # Amplia para 50% do tráfego
      - setWeight: 50

      # Executa uma segunda validação
      - analysis:
          templates:
            - templateName: orders-api-smoke-test

      # Promove para 100%
      - setWeight: 100
